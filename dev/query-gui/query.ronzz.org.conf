# query.ronzz.org — WDQS query GUI (deployed 2026-09-01, see RonzzIT:Deployment/Wikibase)
# Static frontend (wikidata-query-gui build/) + read-only SPARQL proxy to WDQS Blazegraph.
# Install: /etc/nginx/sites-available/query.ronzz.org.conf + symlink into sites-enabled.
# Rate-limit zone lives in /etc/nginx/conf.d/query-ronzz-rate.conf (http context).

# HTTP server - redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name query.ronzz.org;

    root /var/www/wdqs/query-gui/build;

    location /.well-known/acme-challenge/ {
        root /var/www/wdqs/query-gui/build;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/query.access.log;
    error_log /var/log/nginx/query.error.log;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name query.ronzz.org;

    ssl_certificate /etc/letsencrypt/live/query.ronzz.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/query.ronzz.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/query.ronzz.org/chain.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/wdqs/query-gui/build;
    index index.html;

    # Static GUI
    location / {
        try_files $uri $uri/ =404;
    }

    # Wikidata Query Builder (Vue app, vite base /querybuilder/; dist from a
    # local build, see dev/query-gui/README.md)
    location /querybuilder/ {
        # single-view Vue app (no router) — direct file serving, no SPA fallback.
        # (alias + try_files is incompatible in nginx; see the asset 404s of the
        # first attempt on 2026-09-01.)
        alias /var/www/wdqs/query-builder/dist/;
        index index.html;
    }

    # SPARQL endpoint — read-only proxy to the local WDQS Blazegraph (127.0.0.1:9999).
    # Read-only: Blazegraph only executes an update when the request carries an
    # "update=" parameter or Content-Type: application/sparql-update; both are
    # refused here. The WDQS updater and incident-5 LOADs talk to the loopback
    # directly, so the store keeps its write capability and this proxy is the
    # public gate. Residual gap (see RonzzIT:Runbook/Wikibase): a POST
    # form-urlencoded body with "update=" cannot be inspected by plain nginx —
    # mitigated by the rate limit; blast radius is the derived, re-syncable graph.
    location /sparql {
        limit_req zone=sparql burst=20 nodelay;

        if ($arg_update) { return 403; }
        if ($content_type ~* "application/sparql-update") { return 403; }

        proxy_pass http://127.0.0.1:9999/bigdata/namespace/wdq/sparql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 2m;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
        if ($request_method = OPTIONS) { return 204; }

        access_log /var/log/nginx/query.sparql.access.log;
    }

    access_log /var/log/nginx/query.access.log;
    error_log /var/log/nginx/query.error.log;
}
