# WDQS prefix declarations for the dev/CI stack (mount target:
# /wdqs/prefixes.conf in the wdqs service, dev/docker-compose.ci.yml).
#
# Format is Blazegraph's PrefixDeclProcessor.additionalDeclsFile: one
# "PREFIX <name>: <uri>" triple per line, no blank lines (a blank line
# truncates the rest of the file - PrefixDeclProcessor.processAdditionalDecls).
# Entries here override the wikidata.org defaults compiled into WDQS /
# registered by WikibaseContextListener.addPrefixes() (addDeclIfNew keeps the
# first value, so anything in this file wins). Explicit PREFIX clauses in a
# query still override these.
#
# The dev stack's JVM already derives wd/wdt/... from -DwikibaseHost=wikibase
# (concept URI http://wikibase); this file pins the same URIs and, unlike the
# stock image's prefixes.conf, fixes psn/pqn/prn which the upstream file
# points at wikidata.org. Production has the same file shape with
# https://wikibase.ronzz.org URIs (server-side, see RonzzIT:Deployment/Wikibase
# §WDQS). Keep the two in sync.
PREFIX wd: <http://wikibase/entity/>
PREFIX wdata: <http://wikibase/wiki/Special:EntityData/>
PREFIX wds: <http://wikibase/entity/statement/>
PREFIX wdv: <http://wikibase/value/>
PREFIX wdref: <http://wikibase/reference/>
PREFIX wdt: <http://wikibase/prop/direct/>
PREFIX wdtn: <http://wikibase/prop/direct-normalized/>
PREFIX p: <http://wikibase/prop/>
PREFIX ps: <http://wikibase/prop/statement/>
PREFIX psv: <http://wikibase/prop/statement/value/>
PREFIX psn: <http://wikibase/prop/statement/value-normalized/>
PREFIX pq: <http://wikibase/prop/qualifier/>
PREFIX pqv: <http://wikibase/prop/qualifier/value/>
PREFIX pqn: <http://wikibase/prop/qualifier/value-normalized/>
PREFIX pr: <http://wikibase/prop/reference/>
PREFIX prv: <http://wikibase/prop/reference/value/>
PREFIX prn: <http://wikibase/prop/reference/value-normalized/>
PREFIX wdno: <http://wikibase/prop/novalue/>
PREFIX mwapi: <https://www.mediawiki.org/ontology#API/>
PREFIX gas: <http://www.bigdata.com/rdf/gas#>
PREFIX wdsubgraph: <https://query.wikidata.org/subgraph/>
