# ronzz-wikibase dev/CI stack (issue #6, D6).
#
# Reference deployment, matching the production versions where possible:
#   MediaWiki 1.46 (wikibase/wikibase:mw1.46.0) · WDQS 0.3.156 · MariaDB 11
#
# The wikibase image ships its own extensions; our two extensions are
# bind-mounted into the extensions dir, and the seed-generated config
# (seed/generated/ronzz-wikibase.php) is mounted into LocalSettings.d and
# require_once'd by dev/extra-install.sh on first boot.
#
# Usage:
#   mkdir -p seed/generated
#   docker compose -f dev/docker-compose.ci.yml up -d
#   ... seed (see dev/README.md) ...
#   docker compose -f dev/docker-compose.ci.yml restart mediawiki
#   docker compose -f dev/docker-compose.ci.yml down -v   # clean reset

services:
  mediawiki:
    image: wikibase/wikibase:mw1.46.0
    ports:
      - "127.0.0.1:8082:80"
    environment:
      MW_ADMIN_NAME: ${MW_ADMIN_NAME:-CIAdmin}
      MW_ADMIN_PASS: ${MW_ADMIN_PASS:-ci-admin-pass-2026}
      MW_ADMIN_EMAIL: ${MW_ADMIN_EMAIL:-ci@example.org}
      MW_SITE_NAME: "ronzz-wikibase dev"
      MW_SITE_LANG: fr
      MW_WG_SECRET_KEY: ${MW_WG_SECRET_KEY:-dev-only-secret-key-do-not-use-in-prod}
      DB_SERVER: mysql
      DB_NAME: my_wiki
      DB_USER: wikiuser
      DB_PASS: sqlpass
    volumes:
      - ./extra-install.sh:/extra-install.sh:ro
      - ../seed/generated:/var/www/html/LocalSettings.d
      - ../extensions/EmbeddableContent:/var/www/html/extensions/EmbeddableContent:ro
      - ../extensions/WikibaseCitation:/var/www/html/extensions/WikibaseCitation:ro
    depends_on:
      - mysql

  mysql:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: my_wiki
      MYSQL_USER: wikiuser
      MYSQL_PASSWORD: sqlpass
      MYSQL_ROOT_PASSWORD: sqlpass
    volumes:
      - db-data:/var/lib/mysql

  wdqs:
    image: wikibase/wdqs:wdqs0.3.156
    ports:
      - "127.0.0.1:9999:9999"
    environment:
      WIKIBASE_HOST: mediawiki
      WDQS_HOST: wdqs
      WDQS_PORT: 9999
    depends_on:
      - mediawiki

  wdqs-updater:
    image: wikibase/wdqs:wdqs0.3.156
    command: ./runUpdate.sh
    environment:
      WIKIBASE_HOST: mediawiki
      WDQS_HOST: wdqs
      WDQS_PORT: 9999
      WIKIBASE_MAX_DAYS_BACK: 90
    depends_on:
      - mediawiki
      - wdqs

volumes:
  db-data:
