<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Internal use only</title>
<style>
	:root { color-scheme: light dark; }
	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #f8f9fa;
		color: #202122;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
	}
	.box {
		max-width: 34em;
		margin: 1.5em;
		padding: 1.5em 1.75em;
		border: 1px solid #c8ccd1;
		border-left: 4px solid #fc3;
		border-radius: 2px;
		background: #fff;
		line-height: 1.55;
	}
	a { color: #36c; }
	@media (prefers-color-scheme: dark) {
		body { background: #101418; color: #eaecf0; }
		.box { background: #1b1f23; border-color: #54595d; }
		a { color: #6e9ef5; }
	}
</style>
</head>
<body>
<div class="box">
	<p><strong>Internal use only</strong></p>
	<p>Unfortunately, due to copyright restrictions, you must be logged-in to view this file.</p>
	<p><a href="/wiki/Special:UserLogin">Log in</a></p>
</div>
</body>
</html>
