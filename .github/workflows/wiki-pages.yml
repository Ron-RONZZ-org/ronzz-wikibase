name: Wiki page sync

# Two-way sync for the repo's tracked wiki pages (wiki_pages/):
#   - hourly (schedule): wiki -> repo, auto-committed to main;
#   - push to main touching wiki_pages/: repo -> wiki;
#   - manual: status / verify / pull / push.
#
# Conflict contract: if BOTH the wiki and the repo changed since the last
# synchronized state (wiki_pages/state.json) and the contents differ, the
# tool exits 3, writes a report, this workflow opens/updates a
# `wiki-sync-conflict` issue, and NOTHING is overwritten on either side.
#
# Credentials: WIKI_SYNC_BOT_USER / WIKI_SYNC_BOT_PASS (a bot password with
# `editsiteconfig` for MediaWiki:Common.css/JS and edit/create rights for
# templates). Repo writes use the workflow's GITHUB_TOKEN.

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths:
      - 'wiki_pages/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync operation'
        type: choice
        options: [status, verify, pull, push, login]
        default: status

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: wiki-pages-sync
  cancel-in-progress: false

jobs:
  sync:
    # A sync PR carries [wiki-sync] in its merge subject. Its merge must not
    # re-run the repo→wiki push step (the content already lives on the wiki).
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[wiki-sync]')
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'schedule' && 'pull' || github.event_name == 'push' && 'push' || inputs.mode }}
      WIKI_SYNC_BOT_USER: ${{ secrets.WIKI_SYNC_BOT_USER }}
      WIKI_SYNC_BOT_PASS: ${{ secrets.WIKI_SYNC_BOT_PASS }}
      # A GITHUB_TOKEN-created PR does not trigger pull_request CI, so the
      # PR path needs a fine-grained PAT (contents + pull requests write).
      # Until it is configured, fall back to the legacy direct push.
      HAS_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_GH_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.WIKI_SYNC_GH_TOKEN || github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The PAT makes the branch push trigger pull_request CI (GITHUB_TOKEN
          # pushes are suppressed). Falls back to GITHUB_TOKEN when unset.
          token: ${{ secrets.WIKI_SYNC_GH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine mode
        id: mode
        run: echo "value=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run sync
        id: sync
        run: |
          set +e
          python3 tools/wiki_pages.py "$MODE" --report /tmp/wiki-pages-conflict.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish via pull request (auto-merge)
        if: steps.sync.outputs.code == '0' && env.HAS_SYNC_TOKEN == 'true' && (steps.mode.outputs.value == 'pull' || steps.mode.outputs.value == 'push')
        run: |
          set -euo pipefail
          mode="${{ steps.mode.outputs.value }}"
          if [ "$mode" = "pull" ]; then
            branch="wiki-pages-pull"
            title="chore(wiki-pages): pull production changes [wiki-sync]"
            body_text="Automated wiki → repo sync (pull)."
            git add wiki_pages
          else
            branch="wiki-pages-push"
            title="chore(wiki-pages): record pushed revisions [wiki-sync]"
            body_text="Automated repo → wiki sync state (push)."
            git add wiki_pages/state.json
          fi
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git config user.name "ronzz-wiki-sync"
          git config user.email "wiki-sync@ronzz.org"
          git checkout -B "$branch"
          git commit -m "$title"
          git push --force origin "$branch"
          body=/tmp/wiki-pages-pr.md
          {
            echo "$body_text"
            echo
            echo "Generated by \`.github/workflows/wiki-pages.yml\`; auto-merges when the required checks pass."
          } > "$body"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$title" --body-file "$body"
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body"
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --merge \
            --subject "$title" --body "Automated wiki sync."

      - name: Commit pulled wiki changes
        if: steps.mode.outputs.value == 'pull' && steps.sync.outputs.code == '0' && env.HAS_SYNC_TOKEN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki_pages
          if git diff --cached --quiet; then
            echo "no wiki page changes to commit"
            exit 0
          fi
          git commit -m "chore(wiki-pages): pull production changes [skip ci]"
          # A manual push can land between checkout and push, changing
          # state.json. Instead of rebasing (which conflicts on the generated
          # state), restart from the latest main and re-run the pull.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push raced with another commit; retrying ($attempt/3)"
            git fetch origin main
            git reset --hard origin/main
            python3 tools/wiki_pages.py pull
            git add wiki_pages
            if git diff --cached --quiet; then
              echo "no wiki page changes after retry"
              exit 0
            fi
            git commit -m "chore(wiki-pages): pull production changes [skip ci]"
            sleep 5
          done
          echo "could not commit the pull after 3 attempts" >&2
          exit 1

      - name: Record pushed wiki revisions
        if: steps.mode.outputs.value == 'push' && steps.sync.outputs.code == '0' && env.HAS_SYNC_TOKEN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki_pages/state.json
          if git diff --cached --quiet; then
            echo "no state changes to commit"
            exit 0
          fi
          git commit -m "chore(wiki-pages): record pushed revisions [skip ci]"
          # Same race: restart from the latest main and re-run the push (it is
          # idempotent; baserevid still guards the wiki side).
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push raced with another commit; retrying ($attempt/3)"
            git fetch origin main
            git reset --hard origin/main
            python3 tools/wiki_pages.py push
            git add wiki_pages/state.json
            if git diff --cached --quiet; then
              echo "no state changes after retry"
              exit 0
            fi
            git commit -m "chore(wiki-pages): record pushed revisions [skip ci]"
            sleep 5
          done
          echo "could not record the pushed revisions after 3 attempts" >&2
          exit 1

      - name: Report a sync conflict
        if: steps.sync.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/wiki-pages-conflict.md ]; then
            echo "conflict exit without a report" >&2
            exit 1
          fi
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label wiki-sync-conflict --state open --limit 1 --json number \
            --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/wiki-pages-conflict.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Wiki page sync conflict" \
              --label wiki-sync-conflict \
              --body-file /tmp/wiki-pages-conflict.md
          fi

      - name: Fail loudly
        if: steps.sync.outputs.code != '0'
        run: |
          if [ "${{ steps.sync.outputs.code }}" = "3" ]; then
            echo "::error::wiki page sync conflict — nothing was overwritten; resolve the issue and re-run"
          else
            echo "::error::wiki page sync failed"
          fi
          exit "${{ steps.sync.outputs.code }}"
