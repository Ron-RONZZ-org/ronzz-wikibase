name: frontends-deploy
# Zero-touch deploys for the two query frontends on ronzz-linux-server-2:
#   - the SPARQL query GUI   (wikimedia/wikidata-query-gui,   pinned dd58b26)
#   - the visual Query Builder (wikimedia/wikidata-query-builder, pinned d2b960a)
# Triggered by pushes touching the frontend config/patch/workflow, or manually
# (workflow_dispatch). Builds happen on the runner; the deploy step pushes the
# dists over SSH as the least-privileged `deploy` user (forced-command rsync
# gate, see dev/query-gui/deploy-rsync-gate.sh). No credentials beyond the
# DEPLOY_SSH_KEY secret; the server host key is pinned below (public).

on:
  push:
    branches: [ main ]
    paths:
      - 'dev/query-gui/custom-config.json'
      - 'dev/query-gui/query-builder.env.production'
      - 'dev/query-gui/patches/**'
      - 'dev/query-gui/deploy-rsync-gate.sh'
      - '.github/workflows/frontends-deploy.yml'
  workflow_dispatch:

concurrency:
  group: frontends-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gui:
    name: Build query GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wikimedia/wikidata-query-gui
          ref: dd58b265363e654ab2c8a6ec553aced2637fec18   # pinned dd58b26 (2025-02-24); upstream has no releases
          path: gui
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the Query-Helper noise patch
        run: git -C gui apply ../repo/dev/query-gui/patches/0001-query-helper-parse-noise.patch
      - name: npm ci (skip scripts — puppeteer postinstall not needed)
        working-directory: gui
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build (only_build, NOT build — auto_install prunes devDeps mid-build)
        working-directory: gui
        run: ./node_modules/.bin/grunt only_build
      - name: Ship the runtime config into build/
        run: cp repo/dev/query-gui/custom-config.json gui/build/custom-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: gui-build
          path: gui/build/

  builder:
    name: Build Query Builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wikimedia/wikidata-query-builder
          ref: d2b960af9b6417ce2c9c32d224671d5988d5ad37   # pinned d2b960a (2025-03-27)
          path: builder
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure for RonzzWiki (build-time env)
        run: cp repo/dev/query-gui/query-builder.env.production builder/.env.production
      - name: npm ci (skip scripts — Cypress binary not needed)
        working-directory: builder
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build (base must match the nginx location /querybuilder/)
        working-directory: builder
        run: npm run build -- --base=/querybuilder/
      - uses: actions/upload-artifact@v4
        with:
          name: builder-dist
          path: builder/dist/

  deploy:
    name: Deploy to ronzz-linux-server-2
    runs-on: ubuntu-latest
    needs: [ gui, builder ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gui-build
          path: gui-build
      - uses: actions/download-artifact@v4
        with:
          name: builder-dist
          path: builder-dist
      - name: rsync the dists to the server (least-privileged deploy user)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          command -v rsync >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rsync; }
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # server host key pinned (public); no TOFU
          cat >> "$HOME/.ssh/known_hosts" <<'EOF'
          158.178.193.231 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMe38H8iJk+OXP5Y2WJY8R9WdZQF/6PsjyxBWxSJuLCA
          EOF
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # -rlptDz = -a without -o/-g (the deploy user can't chown; avoids warnings)
          rsync -rlptDz --delete -e "$SSH" \
            gui-build/ deploy@158.178.193.231:/var/www/wdqs/query-gui/build/
          rsync -rlptDz --delete -e "$SSH" \
            builder-dist/ deploy@158.178.193.231:/var/www/wdqs/query-builder/dist/
