name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The integration job runs a full wikibase-docker stack (MW 1.46 + WDQS) —
# 16 GB runners, so Blazegraph is affordable. Only one stack run at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast unit layer: pure-PHP logic + seed tooling, no MediaWiki.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f Dockerfile.test -t ronzz-wikibase-test .

      - name: Cache composer deps
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-

      - name: Install dev dependencies
        run: docker run --rm -v "$PWD":/app -w /app ronzz-wikibase-test composer install --no-interaction --prefer-dist

      - name: PHPUnit (52 unit tests)
        run: docker run --rm -v "$PWD":/app -w /app ronzz-wikibase-test vendor/bin/phpunit

      - name: Seed unit tests
        run: python3 -m unittest discover -s seed/tests

      - name: Seed dry-run (offline plan)
        run: python3 -m seed.seed_instance --dry-run

  # Integration layer: real MediaWiki+Wikibase, seed + D1 importers + E2E/XSS.
  # Runs in parallel with `unit` (independent concerns; faster feedback).
  integration:
    runs-on: ubuntu-latest
    env:
      MW_ADMIN_NAME: CIAdmin
      MW_ADMIN_PASS: ci-admin-pass-2026   # dev-only, ephemeral runner — not a secret
      API_URL: http://127.0.0.1:8082/api.php
      BASE_URL: http://127.0.0.1:8082
      SPARQL_URL: http://127.0.0.1:9999/bigdata/namespace/wdq/sparql
      COMPOSE: docker compose -f dev/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Cache stack images
        uses: actions/cache@v4
        with:
          path: /tmp/ci-images
          key: wikibase-images-${{ hashFiles('dev/docker-compose.ci.yml') }}
          restore-keys: |
            wikibase-images-

      - name: Load or pull stack images
        run: |
          if [ -f /tmp/ci-images/images.tar ]; then
            docker load -i /tmp/ci-images/images.tar
          else
            $COMPOSE pull
            mkdir -p /tmp/ci-images
            docker save $($COMPOSE config --images) -o /tmp/ci-images/images.tar
          fi

      - name: Start the stack
        run: |
          mkdir -p dev/config seed/generated
          $COMPOSE up -d
          $COMPOSE ps

      - name: Wait for the wiki API (first boot installs MediaWiki+Wikibase)
        run: |
          for i in $(seq 1 300); do
            curl -sf -o /dev/null "$API_URL" && exit 0
            sleep 2
          done
          echo "wiki did not come up — container status:"
          $COMPOSE ps
          echo "--- wikibase logs ---"
          $COMPOSE logs --tail 120 wikibase
          echo "--- mysql logs ---"
          $COMPOSE logs --tail 60 mysql
          exit 1

      - name: D1 importers — vocabulary (property, class, language)
        run: |
          for type in property class language; do
            $COMPOSE exec -T wikibase php maintenance/run.php \
              /var/www/html/extensions/EmbeddableContent/maintenance/importVocabulary.php --type="$type" || exit 1
          done

      - name: D2 seed — dogfood entities + config emission
        run: |
          python3 -m seed.seed_instance \
            --user "$MW_ADMIN_NAME" --password "$MW_ADMIN_PASS" \
            --api-url "$API_URL" --base-url "$BASE_URL" --sparql-url "$SPARQL_URL" \
            --config-out dev/config/ronzz-wikibase-config.php \
            --ids-out seed/generated/ids.json \
            --only=properties,classes,languages,dogfood,config

      - name: Restart the wiki to load the emitted config map
        run: |
          $COMPOSE restart wikibase
          for i in $(seq 1 300); do
            curl -sf -o /dev/null "$API_URL" && break
            sleep 2
          done
          curl -sf "$API_URL" > /dev/null

      - name: E2E acceptance (3 embed surfaces, 5 citation styles, SPARQL)
        run: |
          echo "--- debug: Special:Embed page ---"
          curl -s -o /dev/null -w "Special:Embed HTTP %{http_code}\n" "$BASE_URL/wiki/Special:Embed/$(jq -r .dogfood.quotation seed/generated/ids.json)"
          echo "--- debug: citation json response ---"
          curl -s "$API_URL?action=citation&entity=$(jq -r .dogfood.quotation seed/generated/ids.json)&style=json&output=json&format=json" | python3 -c "import sys; print(sys.stdin.read()[:800])"
          echo "--- debug: embed api without lang ---"
          curl -s "$API_URL?action=embed&entity=$(jq -r .dogfood.quotation seed/generated/ids.json)&output=html&format=json" | python3 -c "import sys; print(sys.stdin.read()[:400])"
          echo "--- debug: Special:Embed body ---"
          curl -s "$BASE_URL/wiki/Special:Embed/$(jq -r .dogfood.quotation seed/generated/ids.json)" | head -c 400; echo
          echo "--- debug: Special:Embed code item body ---"
          curl -s "$BASE_URL/wiki/Special:Embed/$(jq -r .dogfood.code seed/generated/ids.json)" | python3 -c "import sys,re; t=sys.stdin.read(); m=re.search(r'(Exception|Error)[^<]{0,400}', t); print('ERR:', m.group(0)[:400] if m else t[-800:])"
          echo "--- debug: wikibase container log tail ---"
          echo "updater requests in wiki access log:"; $COMPOSE logs --tail 400 wikibase 2>&1 | grep "Wikidata-Query-RDF" | tail -5 || true
          $COMPOSE logs --tail 60 wikibase 2>&1 | tail -15 || true
          echo "--- debug: wdqs container status + logs ---"
          $COMPOSE ps -a wdqs wdqs-updater 2>&1 || true
          $COMPOSE logs --tail 120 wdqs-updater 2>&1 | grep -E "Unexpected|JsonParse|Exception|ERROR|WARN|Updating via|Started Updater" | head -12 || true
          echo "--- debug: api path probe ---"
          echo "recentchanges body:"; curl -s "$API_URL?action=query&list=recentchanges&rcprop=title%7Cids&rclimit=5&format=json" | head -c 300; echo
          echo "updater-style request:"; curl -s -A "Wikidata-Query-RDF/1.0 (https://github.com/wikimedia/wikidata-query-rdf) Bot/1.0" "$API_URL?action=query&list=recentchanges&rcdir=newer&rcprop=title%7Cids%7Ctimestamp&rcnamespace=0%7C120&rclimit=500&continue=&rcstart=2026-08-16T18%3A00%3A00Z&format=json" | head -c 200; echo
          for ua in "Wikidata-Query-RDF/1.0 (https://github.com/wikimedia/wikidata-query-rdf) Bot/1.0" "Java/17.0.10" "curl/8.5.0"; do
            echo "UA [$ua]:"; curl -s -A "$ua" "$API_URL?action=query&list=recentchanges&rclimit=1&format=json" | head -c 120; echo
          done
          curl -s -o /dev/null -w "/w/api.php: %{http_code}\n" "$BASE_URL/w/api.php?action=query&list=recentchanges&format=json"
          echo "--- debug: in-network probe from wdqs (blazegraph) container ---"
          $COMPOSE exec -T wdqs sh -c 'echo "with UA:"; curl -s -A "Wikidata-Query-RDF/1.0 Bot/1.0" "http://wikibase/w/api.php?action=query&list=recentchanges&rclimit=1&format=json" | head -c 150; echo; echo "no UA:"; curl -s "http://wikibase/w/api.php?action=query&list=recentchanges&rclimit=1&format=json" | head -c 150; echo' 2>&1 | head -6 || true
          echo "--- debug: sparql probe ---"
          curl -sG "$SPARQL_URL" --data-urlencode 'query=SELECT ?s ?p ?o WHERE { ?s ?p ?o } LIMIT 5' --data-urlencode 'format=json' | head -c 600; echo
          python3 tests/e2e/run_e2e.py check \
            --api-url "$API_URL" --base-url "$BASE_URL" --sparql-url "$SPARQL_URL" \
            --quote "$(jq -r .dogfood.quotation seed/generated/ids.json)" \
            --code "$(jq -r .dogfood.code seed/generated/ids.json)" \
            --math "$(jq -r .dogfood.math seed/generated/ids.json)" \
            --instance-of "$(jq -r '."properties"."instance of"' seed/generated/ids.json)" \
            --quotation-class "$(jq -r '."classes"."quotation content"' seed/generated/ids.json)" \
            --sparql-wait 300

      - name: XSS suite (injections must not survive)
        run: |
          python3 tests/e2e/run_e2e.py xss \
            --api-url "$API_URL" --base-url "$BASE_URL" \
            --user "$MW_ADMIN_NAME" --password "$MW_ADMIN_PASS"

      - name: Tear down the stack
        if: always()
        run: $COMPOSE down -v
